<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>測試版</title>
<style>
body { margin:0; overflow:hidden; background:#87CEEB; }
#ui { position:fixed; top:12px; left:12px; background:rgba(0,0,0,.6); color:#fff; padding:10px 14px; border-radius:8px; }
</style>
</head>
<body>
<div id="ui">測試畫面 - 如果看到島嶼代表成功</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 8, 15);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(5, 10, 5);
scene.add(light);

// 海面
const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({color:0x1e90ff})
);
sea.rotation.x = -Math.PI/2;
scene.add(sea);

// 島嶼
const island = new THREE.Mesh(
  new THREE.CylinderGeometry(6, 8, 1.2, 16),
  new THREE.MeshStandardMaterial({color:0x3a9d23})
);
island.position.y = 0.3;
scene.add(island);

// 山
const mountain = new THREE.Mesh(
  new THREE.ConeGeometry(2, 4, 8),
  new THREE.MeshStandardMaterial({color:0x8b5a2b})
);
mountain.position.set(4, 2, 1);
scene.add(mountain);

// 幾個站點球
for (let i = 0; i < 6; i++) {
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 12, 8),
    new THREE.MeshStandardMaterial({color:0xffaa44})
  );
  const angle = (i / 6) * Math.PI * 2;
  ball.position.set(Math.cos(angle)*5, 1, Math.sin(angle)*5);
  scene.add(ball);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
