<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D 互動教學小島｜國小自然</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; font-family:"Microsoft JhengHei",sans-serif; background:#87CEEB; }
#container { width:100vw; height:100vh; }
#ui {
  position:fixed; top:12px; left:12px; z-index:10;
  background:rgba(0,0,0,.55); color:#fff; padding:10px 14px;
  border-radius:12px; font-size:15px; display:flex; align-items:center; gap:10px;
}
#mute-btn {
  background:rgba(255,255,255,.2); border:none; color:#fff;
  width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px;
}
#card {
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  width:92%; max-width:500px; background:#fff; color:#222;
  border-radius:16px; padding:18px; z-index:20; display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.25); max-height:70vh; overflow-y:auto;
}
#card h2 { margin:0 0 8px; color:#1a5f7a; }
#card-options button {
  display:block; width:100%; margin:6px 0; padding:10px;
  border:none; border-radius:8px; background:#e8f4f8; cursor:pointer; text-align:left;
}
#close-btn { margin-top:8px; padding:8px 16px; background:#1a5f7a; color:#fff; border:none; border-radius:8px; cursor:pointer; }
#celebrate { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:30; }
#celebrate-inner { background:#fff; padding:24px; border-radius:16px; max-width:400px; text-align:center; }
.station-label { color:#fff; background:rgba(0,0,0,.7); padding:3px 8px; border-radius:6px; font-size:13px; pointer-events:none; font-weight:bold; }
</style>
</head>
<body>
<div id="container"></div>
<div id="ui">進度：<span id="prog">0</span>／6 <button id="mute-btn">🔊</button></div>
<div id="card">
  <h2 id="card-title"></h2>
  <p id="card-points"></p>
  <p id="card-question"></p>
  <div id="card-options"></div>
  <div id="card-result"></div>
  <button id="close-btn">關閉並返回</button>
</div>
<div id="celebrate">
  <div id="celebrate-inner">
    <h1>🎉 全部完成！</h1>
    <p>單元1：了解雲霧露霜、天氣圖與颱風。</p>
    <p>單元2：理解熱脹冷縮、熱的傳播與保溫散熱。</p>
    <button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;background:#e67e22;color:#fff;border:none;border-radius:8px;">再玩一次</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const stations = [
  {id:1,name:"雲霧山",pos:[10,0,4],title:"雲和霧、露和霜",points:"水蒸氣看不見；遇冷凝結成小水滴，在高空是雲、近地面是霧。",question:"雲和霧是什麼？",options:["A. 水蒸氣","B. 小水滴或冰晶","C. 煙"],answer:1,type:"cloud"},
  {id:2,name:"氣象站",pos:[7,0,-5],title:"衛星雲圖與地面天氣圖",points:"H高氣壓常晴朗，L低氣壓常陰雨。滯留鋒造成梅雨。",question:"造成梅雨的是？",options:["A. 冷鋒","B. 暖鋒","C. 滯留鋒"],answer:2,type:"weather"},
  {id:3,name:"颱風海岸",pos:[3,0,9],title:"認識颱風與防颱",points:"颱風由熱帶海洋低氣壓發展而成。",question:"颱風通常在哪裡形成？",options:["A. 高山","B. 熱帶海洋","C. 沙漠"],answer:1,type:"typhoon"},
  {id:4,name:"熱脹冷縮實驗屋",pos:[-8,0,5],title:"熱脹冷縮",points:"受熱體積變大是因為粒子間距離變大。",question:"物體受熱膨脹是因為？",options:["A. 粒子變大","B. 粒子間距離變大","C. 粒子變多"],answer:1,type:"expand"},
  {id:5,name:"營火廣場",pos:[-10,0,-2],title:"熱的三種傳播方式",points:"太陽的熱靠輻射傳到地球。",question:"太陽的熱傳到地球靠的是？",options:["A. 傳導","B. 對流","C. 輻射"],answer:2,type:"fire"},
  {id:6,name:"節能小屋",pos:[-6,0,-8],title:"保溫與散熱",points:"冷空氣會下降，所以冷氣機裝在高處。",question:"冷氣機應裝在？",options:["A. 較高處","B. 較低處","C. 都一樣"],answer:0,type:"house"}
];

let muted = false;
document.getElementById("mute-btn").onclick = () => {
  muted = !muted;
  document.getElementById("mute-btn").textContent = muted ? "🔇" : "🔊";
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 12, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.getElementById("container").appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = "absolute";
labelRenderer.domElement.style.top = "0";
labelRenderer.domElement.style.pointerEvents = "none";
document.getElementById("container").appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.target.set(0, 1, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(10, 20, 10);
scene.add(light);

const seaGeo = new THREE.PlaneGeometry(100, 100, 20, 20);
const sea = new THREE.Mesh(seaGeo, new THREE.MeshStandardMaterial({ color: 0x1e90ff, transparent: true, opacity: 0.85 }));
sea.rotation.x = -Math.PI / 2;
sea.position.y = -0.5;
scene.add(sea);

const island = new THREE.Mesh(new THREE.CylinderGeometry(10, 12, 1.5, 16), new THREE.MeshStandardMaterial({ color: 0x3a9d23 }));
scene.add(island);
scene.add(Object.assign(new THREE.Mesh(new THREE.ConeGeometry(3, 6, 8), new THREE.MeshStandardMaterial({ color: 0x8b5a2b })), { position: new THREE.Vector3(7, 3, 2) }));

const stationGroups = [];
stations.forEach(st => {
  const g = new THREE.Group();
  g.position.set(...st.pos);
  g.userData = st;
  st.group = g;

  g.add(new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.3, 8), new THREE.MeshStandardMaterial({ color: 0xcccccc })));

  if (st.type === "cloud") g.add(new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 6), new THREE.MeshStandardMaterial({ color: 0x888888 })));
  if (st.type === "weather") g.add(new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 1.5), new THREE.MeshStandardMaterial({ color: 0xdddddd })));
  if (st.type === "typhoon") g.add(new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 6), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 })));
  if (st.type === "expand") g.add(new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 8), new THREE.MeshStandardMaterial({ color: 0xcd7f32 })));
  if (st.type === "fire") g.add(new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 6), new THREE.MeshStandardMaterial({ color: 0xff5500 })));
  if (st.type === "house") g.add(new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.4, 1.5), new THREE.MeshStandardMaterial({ color: 0xf5deb3 })));

  const div = document.createElement("div");
  div.className = "station-label";
  div.textContent = st.name;
  const label = new CSS2DObject(div);
  label.position.set(0, 2.2, 0);
  g.add(label);

  scene.add(g);
  stationGroups.push(g);
});

let current = null, flying = false;
const completed = new Set();
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function showCard(st) {
  document.getElementById("card-title").textContent = st.title;
  document.getElementById("card-points").textContent = st.points;
  document.getElementById("card-question").textContent = st.question;
  const box = document.getElementById("card-options");
  box.innerHTML = "";
  st.options.forEach((op, i) => {
    const b = document.createElement("button");
    b.textContent = op;
    b.onclick = () => {
      const res = document.getElementById("card-result");
      if (i === st.answer) {
        res.textContent = "答對了！";
        res.style.color = "green";
        if (!completed.has(st.id)) {
          completed.add(st.id);
          document.getElementById("prog").textContent = completed.size;
        }
        if (completed.size === 6) setTimeout(() => document.getElementById("celebrate").style.display = "flex", 500);
      } else {
        res.textContent = "再試一次！";
        res.style.color = "red";
      }
    };
    box.appendChild(b);
  });
  document.getElementById("card-result").textContent = "";
  document.getElementById("card").style.display = "block";
}

document.getElementById("close-btn").onclick = () => {
  document.getElementById("card").style.display = "none";
  flying = false;
  controls.enabled = true;
  current = null;
};

function onClick(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const clientX = e.clientX || e.touches?.[0]?.clientX;
  const clientY = e.clientY || e.touches?.[0]?.clientY;
  if (clientX == null) return;
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  mouse.x = (x / rect.width) * 2 - 1;
  mouse.y = -(y / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(stationGroups, true);
  if (hits.length) {
    let obj = hits[0].object;
    while (obj && !obj.userData.id) obj = obj.parent;
    if (obj?.userData.id) {
      current = obj.userData;
      flying = true;
      controls.enabled = false;
      showCard(current);
    }
  }
}
renderer.domElement.addEventListener("pointerdown", onClick);

function animate() {
  requestAnimationFrame(animate);
  const t = Date.now() * 0.001;

  const pos = seaGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getY(i);
    pos.setZ(i, Math.sin(x * 0.2 + t) * 0.15 + Math.cos(z * 0.15 + t) * 0.1);
  }
  pos.needsUpdate = true;

  if (flying && current) {
    camera.position.lerp(current.group.position.clone().add(new THREE.Vector3(0, 4, 7)), 0.06);
    controls.target.lerp(current.group.position, 0.06);
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
